- Type: "window"
  W: 68
  H: 26
  children:
  - Type: "area"
    W: 50  # 幅を決めないとAlignが効かない
    AlignCenterX: true
    children:
    - Type: "title"
      Y: 3
    - Type: "area"
      Y: 14
      W: 16
      H: 2
      AlignCenterX: true
      children:
      - Type: "start"
        Text: "START, CONTINUE"
        RowsNum: 1
        Events: ["key:up", "key:down", "key:enter"]
        script: >
          (if ($event "key:enter")
            (set @Action 
              (switch @SelectNo "START" "CONTINUE")))
        children:
        - Type: "title_close"
          IsEnable: false
    - Type: "label"
      Text: "-MESSAGE SPEAD-"
      X: 16
      Y: 19
    - Type: "speed"
      X: 3 
      Y: 20
      Text: "SLOW, NORMAL, FAST"
      RowsNum: 3
      Events: ["key:left", "key:right"]
