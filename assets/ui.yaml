- Type: "window"
  X: 0
  Y: 0
  W: 68
  H: 26
  children:
    - Type: "area"
      W: 50  # 幅を決めないとAlignが効かない
      MarginX: 0
      MarginY: 0
      AlignCenterX: true
      children:
        - Type: "title"
          X: 0
          Y: 2
        - Type: "area"
          X: 0
          Y: 14
          W: 16
          H: 2
          AlignCenterX: true
          children:
            - Type: "start"
              Text: "START, CONTINUE"
              Events: ["key:up", "key:down"]
        - Type: "label"
          Text: "-MESSAGE SPEAD-"
          X: 16
          Y: 19
        - Type: "speed"
          X: 3 
          Y: 20
          Text: "SLOW, NORMAL, FAST"
          Events: ["key:left", "key:right"]
