version: 3

vars:
  VERSION: v0.0.1
  BIN_DIR: "bin"
  DATA_DIR: "data"
  UI_SRC_YAML: "ui.yaml"
  UI_DIST_JSON: "ui.json"

tasks:
  build:
    desc: "Build"
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
      - ./cmd/**/*.go
    generates:
      - "{{.BIN_DIR}}/main"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/main --tags debug ./cmd/test1

  run:
    desc: "Run"
    deps:
      - build
      - convert
    cmds:
      - "{{.BIN_DIR}}/main"

  convert:
    desc: "Convert"
    sources:
      - "{{.DATA_DIR}}/{{.UI_SRC_YAML}}"
    generates:
      - "{{.BIN_DIR}}/{{.UI_DIST_JSON}}"
    cmds:
      - cat {{.DATA_DIR}}/{{.UI_SRC_YAML}} | yq -o=json > {{.BIN_DIR}}/{{.UI_DIST_JSON}}

  test:
    desc: "Test"
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
    cmds:
      - go test -v ./...


  clean:
    desc: "Clean"
    cmds:
      - "rm -rf {{.BIN_DIR}}/main"

  tag:
    desc: "タグを更新する"
    deps:
      - build
    cmds:
      - git tag {{.VERSION}}
      - git tag

  default:
    cmds:
      - task --list

