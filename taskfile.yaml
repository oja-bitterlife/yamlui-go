version: 3

vars:
  VERSION: v0.0.1
  BIN_DIR: "bin"
  ASSET_DIR: "assets"
  UI_SRC_YAML: "ui.yaml"
  UI_DIST_JSON: "ui.json"

tasks:
  jj-st:
    desc: "Run jj st"
    cmds:
      - jj st

  build_converter:
    desc: "build converter"
    scources:
      - ./cmd/converter/*.go
    generates:
      - "{{.BIN_DIR}}/converter"
    cmds:
      - go build -o {{.BIN_DIR}}/converter --tags debug ./cmd/converter

  convert:
    desc: "run convert"
    deps:
      - build_converter
    cmds:
      - "{{.BIN_DIR}}/converter"

  build:
    desc: "Build"
    deps:
      - jj-st
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
      - ./cmd/**/*.go
    generates:
      - "{{.BIN_DIR}}/main"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/main --tags debug ./cmd/test1

  run:
    desc: "Run"
    deps:
      - build
      - convert
    cmds:
      - "{{.BIN_DIR}}/main"

  test:
    desc: "Test"
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
    cmds:
      - go test -v ./...


  clean:
    desc: "Clean"
    cmds:
      - "rm -rf {{.BIN_DIR}}/main"

  tag:
    desc: "タグを更新する"
    deps:
      - build
    cmds:
      - git tag {{.VERSION}}
      - git tag

  default:
    cmds:
      - task --list

