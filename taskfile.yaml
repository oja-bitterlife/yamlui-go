version: 3

vars:
  VERSION: v0.0.1
  BIN_DIR: "bin"
  ASSET_DIR: "assets"
  UI_SRC_YAML: "ui.yaml"
  UI_DIST_JSON: "ui.json"

tasks:
  jj-st:
    desc: "Run jj st"
    cmds:
      - jj st

  build_converter:
    desc: "build converter"
    scources:
      - ./cmd/converter/*.go
    generates:
      - "{{.BIN_DIR}}/converter"
    cmds:
      - go build -o {{.BIN_DIR}}/converter --tags debug ./cmd/converter

  convert:
    desc: "run convert"
    deps:
      - build_converter
    generates:
      - "{{.BIN_DIR}}/ui.json"
    cmds:
      - "{{.BIN_DIR}}/converter > {{.BIN_DIR}}/ui.json"

  build_tiny:
    desc: "Build TinyGo"
    deps:
      - jj-st
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
      - ./cmd/**/*.go
    generates:
      - "{{.BIN_DIR}}/tiny"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - tinygo build -o {{.BIN_DIR}}/tiny -opt=z ./cmd/tinygo
      - tinygo build -o {{.BIN_DIR}}/tiny.wasm -target=wasm -opt=z ./cmd/tinygo

  check_tiny:
    desc: "Check TinyGo"
    deps:
      - build_tiny
    cmds:
      - ls -lhn {{.BIN_DIR}}/tiny
      - ls -lhn {{.BIN_DIR}}/tiny.wasm
      - nm -S --size-sort -r bin/tiny | head -n 8

  build:
    desc: "Build"
    deps:
      - jj-st
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
      - ./cmd/**/*.go
    generates:
      - "{{.BIN_DIR}}/main"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/main --tags debug ./cmd/test1

  run:
    desc: "Run"
    deps:
      - build
      - convert
    cmds:
      - "{{.BIN_DIR}}/main"

  test:
    desc: "Test"
    sources:
      - ./script/*.go
      - ./builtin/*.go
      - ./yamlui/*.go
    cmds:
      - go test -v ./...

  clean:
    desc: "Clean"
    cmds:
      - "rm -rf {{.BIN_DIR}}/main"
      - "rm -rf {{.BIN_DIR}}/tiny"
      - "rm -rf {{.BIN_DIR}}/tiny.wasm"

  tag:
    desc: "タグを更新する"
    deps:
      - build
    cmds:
      - git tag {{.VERSION}}
      - git tag

  default:
    cmds:
      - task --list

